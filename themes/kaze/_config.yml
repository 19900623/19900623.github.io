# =======================================================
# Hexo Theme Kaze 优化配置文件
# 优化重点：性能、SEO、阅读体验、暗黑模式
# =======================================================

# ----------------------
# 1. 基础信息 (Basic Info)
# ----------------------
# 你的博客标题，显示在侧边栏顶部
title: 我的 Kaze 博客

# 作者名称，显示在侧边栏
author: 你的昵称

# 侧边栏副标题/简介
subtitle: 记录技术，分享生活，保持热爱。

# 头像链接 (建议放在 source/images/ 目录下，或者使用图床链接)
avatar: /images/avatar.png

# 网站图标 (Favicon)
favicon: /images/favicon.ico

# ----------------------
# 2. 菜单配置 (Menu)
# ----------------------
# 格式: 菜单名称: 链接 || 图标
menu:
  首页: / || fa fa-home
  归档: /archives || fa fa-archive
  分类: /categories || fa fa-folder
  标签: /tags || fa fa-tags
  关于: /about || fa fa-user
  # 友链: /friends || fa fa-link

# ----------------------
# 3. 社交链接 (Social Links)
# ----------------------
# 显示在侧边栏底部的社交图标
social:
  github: https://github.com/19900623
  # twitter: https://twitter.com/你的用户名
  # weibo: https://weibo.com/你的用户名
  # zhihu: https://www.zhihu.com/people/你的ID
  email: yourname@example.com

# ----------------------
# 4. 样式与颜色 (Style & Color)
# ----------------------
# 主题主色调 (推荐：蓝色 #3273dc, 绿色 #23d160, 橙色 #ffdd57)
color:
  link: "#3273dc"
  # 代码块背景色 (护眼色推荐 #f5f5f5 或 #282c34)
  code_background: "#f5f5f5"

# 字体设置 (默认使用系统字体栈，加载最快)
font:
  family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
  size: 16px # 正文字号，建议 15px-16px

# ----------------------
# 5. 功能开关 (Features)
# ----------------------

# 暗黑模式 (Dark Mode)
# true: 开启, false: 关闭
dark_mode: true

# 代码块配置
code:
  # 是否显示代码块右上角的复制按钮
  copy_btn: true
  # 代码高亮主题 (light/dark)
  highlight_theme: light

# 文章设置
post:
  # 是否显示文章版权信息
  copyright: true
  # 是否显示文章更新时间
  update_time: true
  # 首页文章摘要长度 (字符数)
  excerpt_length: 150

# 侧边栏挂件
widgets:
  # 移动端是否显示侧边栏 (none: 不显示, flex: 显示)
  mobile: none
  # 桌面端显示的内容
  desktop:
    - category # 分类
    - tag      # 标签
    - recent_posts # 最新文章

# ----------------------
# 6. 第三方服务 (Third Party)
# ----------------------

# 统计功能 (不蒜子 Busuanzi)
# 用于显示页面浏览量和访客数
statistics:
  enable: true

# 评论系统 (Comments)
# 支持: valine, gitalk, disqus, utterances (选填一个)
comments:
  enable: false # 如需开启请改为 true
  type: valine  # 推荐使用 Valine，无后端，速度快
  # Valine 配置示例 (需去 leancloud 申请)
  # appId: '你的LeanCloudAppId'
  # appKey: '你的LeanCloudAppKey'
  # placeholder: '说点什么吧...'

# 搜索功能 (Local Search)
# 需安装 hexo-generator-searchdb 插件
search:
  enable: true
  path: search.xml

# 数学公式支持 (MathJax / Katex)
# 如果文章包含数学公式，建议开启
math:
  enable: false
  engine: mathjax # 或 katex

# ----------------------
# 7. 部署与页脚 (Footer)
# ----------------------
footer:
  # 显示版权信息
  copyright: true
  # 显示 Hexo 和 Kaze 的链接
  powered: true
  # 自定义页脚文字 (支持 HTML)
  custom: ""


